  document.addEventListener('input',event=>{if(!event.target.matches('.loss-product'))return;const row=event.target.closest('.waste-entry'),item=catalog.find(entry=>entry.name===event.target.value);if(!item)return;const spec=row.querySelector('.loss-spec'),amount=row.querySelector('.loss-amount'),quantity=row.querySelector('.loss-quantity');spec.innerHTML='<option data-price="'+item.price+'" selected>'+item.spec+' · '+formatAmount(item.price)+'/单位</option>';amount.dataset.manual='';amount.value=(item.price*(Number(quantity.value)||0)).toFixed(2);amount.classList.add('auto-amount')});
  const batchSpecialFiles=document.getElementById('batch-special-files');document.getElementById('batch-special-upload').addEventListener('click',()=>batchSpecialFiles.click());batchSpecialFiles.addEventListener('change',event=>{const files=[...event.target.files];if(!files.length)return;files.forEach(file=>{addSpecialItem();const row=specialItems.lastElementChild;row.querySelector('.file-state').textContent='✓ 已批量识别：'+file.name;row.querySelector('.module-upload').textContent='已上传：'+file.name});document.getElementById('batch-special-state').textContent='✓ 已批量识别 '+files.length+' 份文件';event.target.value=''});
  const makeProductSingleSelect=row=>{const input=row.querySelector('.loss-product');if(!input||input.tagName==='SELECT')return;const select=document.createElement('select');select.className='loss-product';select.innerHTML='<option value="">请选择商品</option>'+catalog.map(item=>'<option value="'+item.name+'">'+item.name+'</option>').join('');input.replaceWith(select);select.addEventListener('change',()=>{const item=catalog.find(entry=>entry.name===select.value),spec=row.querySelector('.loss-spec'),amount=row.querySelector('.loss-amount'),quantity=row.querySelector('.loss-quantity');spec.innerHTML=item?'<option data-price="'+item.price+'" selected>'+item.spec+' · '+formatAmount(item.price)+'/单位</option>':'<option value="">请选择商品后确认规格</option>';amount.dataset.manual='';amount.value=item?(item.price*(Number(quantity.value)||0)).toFixed(2):'0.00';amount.classList.add('auto-amount')})};wasteItems.querySelectorAll('.waste-entry').forEach(makeProductSingleSelect);document.getElementById('add-waste-item').addEventListener('click',()=>setTimeout(()=>wasteItems.querySelectorAll('.waste-entry').forEach(makeProductSingleSelect),0));
  renderStatus();const requestedModule=new URLSearchParams(window.location.search).get('module');show(['cash','tips','waste'].includes(requestedModule)?requestedModule:'home');
});
</script></body></html>
